name: Audit current WoW ItemSparse data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-current-itemsparse.yml"
      - "scripts/audit_item_variant_tables.py"
      - "scripts/audit_simc_item_sparse.py"

permissions:
  contents: read

jobs:
  audit-item-sparse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out optimizer
        uses: actions/checkout@v4

      - name: Check out SimulationCraft extraction tools
        uses: actions/checkout@v4
        with:
          repository: simulationcraft/simc
          ref: midnight
          path: simulationcraft

      - name: Install extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests fixedint bitarray

      - name: Locate ItemSparse file ID in SimulationCraft's current file list
        shell: bash
        run: |
          set -euo pipefail
          grep -iE 'DBFilesClient[\\/]+ItemSparse[.]db2' simulationcraft/casc_extract/dbfile > "$RUNNER_TEMP/item-sparse-dbfile"
          test "$(wc -l < "$RUNNER_TEMP/item-sparse-dbfile")" -eq 1
          cat "$RUNNER_TEMP/item-sparse-dbfile"

      - name: Locate item variant and upgrade table file IDs
        shell: bash
        run: |
          set -euo pipefail
          grep -iE 'DBFilesClient[\\/]+(ItemUpgrade|RulesetItemUpgrade|GarrItemLevelUpgradeData|ItemBonusSeasonUpgradeCost|ItemBonus|ItemBonusTreeNode|ItemXBonusTree|ItemBonusListLevelDelta|ItemBonusSeason|ItemEffect|ItemXItemEffect|RulesetRaidLootUpgrade|ChrUpgradeBucketSpell|ChrUpgradeBucket|ChrUpgradeTier|ScalingStatDistribution|ItemLevelSelector|ItemLevelSelectorQualitySet|ItemLevelSelectorQuality|ItemBonusList|ItemBonusListWarforgeLevelDelta|ChallengeModeItemBonusOverride|ItemBonusListGroupEntry|ItemBonusSequenceSpell|ItemBonusTree|ItemBonusListGroup|ItemBonusTreeGroupEntry|ItemBonusSeasonBonusListGroup|ScalingStatValues|ItemScalingConfig|ItemGroupIlvlScalingEntry|ItemArmorQuality|ExpectedStat|ExpectedStatMod|ContentTuningXExpectedStatMod|Curve|CurvePoint|GlobalCurve|ItemOffsetCurve)[.]db2' simulationcraft/casc_extract/dbfile > "$RUNNER_TEMP/item-variant-dbfiles"
          test "$(wc -l < "$RUNNER_TEMP/item-variant-dbfiles")" -eq 39
          cat "$RUNNER_TEMP/item-variant-dbfiles"

      - name: Download ItemSparse and variant/upgrade tables from Blizzard CDN
        shell: bash
        run: |
          set -euo pipefail
          printf '[]\n' > "$RUNNER_TEMP/empty-keyfile.json"
          cat "$RUNNER_TEMP/item-sparse-dbfile" "$RUNNER_TEMP/item-variant-dbfiles" > "$RUNNER_TEMP/required-item-dbfiles"
          python simulationcraft/casc_extract/casc_extract.py \
            -m batch --cdn --product wow -k "$RUNNER_TEMP/empty-keyfile.json" \
            -b "$RUNNER_TEMP/required-item-dbfiles" \
            -o "$RUNNER_TEMP/wow-data"

          mapfile -t DB2_FILES < <(find "$RUNNER_TEMP/wow-data" -type f -iname 'ItemSparse.db2' -print)
          test "${#DB2_FILES[@]}" -eq 1
          echo "ITEMSPARSE_PATH=${DB2_FILES[0]}" >> "$GITHUB_ENV"
          echo "ITEMSPARSE_BUILD_DIR=$(dirname "${DB2_FILES[0]}")" >> "$GITHUB_ENV"
          echo "ITEM_TABLES_DIR=$(dirname "${DB2_FILES[0]}")" >> "$GITHUB_ENV"

      - name: Export item variant tables to temporary JSON
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$(basename "$(dirname "$(dirname "$ITEMSPARSE_PATH")")")"
          # SimulationCraft's latest format map predates two current-build tables.
          # Add only fields verified against WoWDBDefs layouts for this exact build.
          python - "$BUILD" <<'PY'
          import json, pathlib, sys
          build = sys.argv[1]
          formats = pathlib.Path("simulationcraft/dbc_extract3/formats")
          target = formats / "{}.json".format(build)
          base = formats / "12.1.0.69299.json"
          data = json.loads((target if target.exists() else base).read_text(encoding="utf-8"))
          data["ItemLevelSelectorQualitySet"] = {
              "fields": [
                  {"data_type": "H", "field": "ilvl_rare"},
                  {"data_type": "H", "field": "ilvl_epic"},
              ]
          }
          data["ItemLevelSelectorQuality"] = {
              "parent": "ItemLevelSelectorQualitySet",
              "fields": [
                  {"data_type": "i", "field": "id_item_bonus_list", "ref": "ItemBonusList"},
                  {"data_type": "b", "field": "quality"},
              ]
          }
          data["Curve"] = {
              "fields": [
                  {"data_type": "B", "field": "type"},
                  {"data_type": "i", "field": "flags"},
              ]
          }
          data["ItemBonusTreeNode"] = {
              "parent": "ItemBonusTree",
              "fields": [
                  {"data_type": "B", "field": "item_context"},
                  {"data_type": "H", "field": "id_child_bonus_tree", "ref": "ItemBonusTree"},
                  {"data_type": "H", "field": "id_child_bonus_list", "ref": "ItemBonusList"},
                  {"data_type": "H", "field": "id_level_selector", "ref": "ItemLevelSelector"},
                  {"data_type": "i", "field": "id_node_group"},
                  {"data_type": "i", "field": "id_group_point_mod_set"},
                  {"data_type": "i", "field": "min_mythic_plus_level"},
                  {"data_type": "i", "field": "max_mythic_plus_level"},
                  {"data_type": "i", "field": "id_item_creation_context_group"},
                  {"data_type": "i", "field": "flags"},
              ]
          }
          target.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Added verified quality-table formats for client build {}".format(build))
          PY
          pushd simulationcraft/dbc_extract3
          for table in ItemUpgrade RulesetItemUpgrade GarrItemLevelUpgradeData ItemBonusSeasonUpgradeCost ItemBonus ItemBonusTreeNode ItemXBonusTree ItemBonusListLevelDelta ItemBonusSeason ItemEffect ItemXItemEffect RulesetRaidLootUpgrade ChrUpgradeBucketSpell ChrUpgradeBucket ChrUpgradeTier ScalingStatDistribution ItemLevelSelector ItemLevelSelectorQualitySet ItemLevelSelectorQuality ItemBonusList ItemBonusListWarforgeLevelDelta ChallengeModeItemBonusOverride ItemBonusListGroupEntry ItemBonusSequenceSpell ItemBonusTree ItemBonusListGroup ItemBonusTreeGroupEntry ItemBonusSeasonBonusListGroup ScalingStatValues ItemScalingConfig ItemGroupIlvlScalingEntry ItemArmorQuality ExpectedStat ExpectedStatMod ContentTuningXExpectedStatMod Curve CurvePoint GlobalCurve ItemOffsetCurve; do
            mapfile -t files < <(find "$ITEM_TABLES_DIR" -maxdepth 1 -type f -iname "$table.db2" -print)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "TABLE_UNAVAILABLE=$table (found ${#files[@]} matching files in this build)" >&2
              continue
            fi
            if ! python dbc_extract.py -t json -b "$BUILD" -p "$ITEM_TABLES_DIR" "$table.db2" > "$RUNNER_TEMP/$table.json"; then
              echo "TABLE_EXPORT_UNSUPPORTED=$table (SimulationCraft DB2 schema/format unavailable)" >&2
              rm -f "$RUNNER_TEMP/$table.json"
              continue
            fi
            if [ ! -s "$RUNNER_TEMP/$table.json" ]; then
              echo "TABLE_EXPORT_EMPTY=$table" >&2
              rm -f "$RUNNER_TEMP/$table.json"
              continue
            fi
          done
          popd
          python scripts/audit_item_variant_tables.py "$RUNNER_TEMP" --allow-missing --output "$RUNNER_TEMP/item-variant-table-summary.json"

      - name: Export build-specific ItemSparse records to temporary JSON
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$(basename "$(dirname "$(dirname "$ITEMSPARSE_PATH")")")"
          test -n "$BUILD"
          echo "CLIENT_BUILD=$BUILD" >> "$GITHUB_ENV"
          # The extractor resolves its formats directory relative to its working directory.
          pushd simulationcraft/dbc_extract3
          python dbc_extract.py \
            -t json -b "$BUILD" -p "$ITEMSPARSE_BUILD_DIR" ItemSparse.db2 \
            > "$RUNNER_TEMP/ItemSparse.json"
          popd
          test -s "$RUNNER_TEMP/ItemSparse.json"

      - name: Run non-guessing item-stat audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_simc_item_sparse.py "$RUNNER_TEMP/ItemSparse.json" \
            --build "$CLIENT_BUILD" --output "$RUNNER_TEMP/item-sparse-audit-full.json"
          # Publish aggregate counts only; do not upload raw client records or examples.
          python - <<'PY'
          import json, os
          source = os.environ["RUNNER_TEMP"] + "/item-sparse-audit-full.json"
          target = os.environ["RUNNER_TEMP"] + "/item-sparse-audit-summary.json"
          report = json.load(open(source, encoding="utf-8"))
          report.pop("exampleRecords", None)
          json.dump(report, open(target, "w", encoding="utf-8"), indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Convert verified stat IDs and measure mapping coverage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/convert_simc_itemsparse_stats.py "$RUNNER_TEMP/ItemSparse.json" \
            --output "$RUNNER_TEMP/item-sparse-conversion-full.json"
          # Upload aggregate counts only; never publish raw client records.
          python - <<'PY'
          import json, os
          root = os.environ["RUNNER_TEMP"]
          report = json.load(open(root + "/item-sparse-conversion-full.json", encoding="utf-8"))
          report.pop("items", None)
          target = root + "/item-sparse-conversion-summary.json"
          json.dump(report, open(target, "w", encoding="utf-8"), indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Upload item variant table audit summary
        uses: actions/upload-artifact@v4
        with:
          name: item-variant-table-summary
          path: ${{ runner.temp }}/item-variant-table-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload stat-mapping coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: item-sparse-conversion-summary
          path: ${{ runner.temp }}/item-sparse-conversion-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload aggregate audit report
        uses: actions/upload-artifact@v4
        with:
          name: item-sparse-audit-summary
          path: ${{ runner.temp }}/item-sparse-audit-summary.json
          if-no-files-found: error
          retention-days: 7
