name: Import WoW Retail Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/import_blizzard_data.py"
      - "scripts/equipment_catalog_sections.py"
      - "scripts/verify_item_stat_coverage.py"
      - ".github/workflows/import-wow-data.yml"
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write
  issues: write

# Avoid overlapping full-catalog scans. Feature-branch runs are for authenticated validation before merge.
concurrency:
  group: wow-retail-data-import
  cancel-in-progress: false

jobs:
  import:
    # Feature-branch pushes are code/test iteration, not permission to start a 45-minute full import.
    # Use workflow_dispatch for deliberate validation; main and scheduled imports remain enabled.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore persistent Blizzard item cache
        uses: actions/cache/restore@v4
        with:
          path: data/blizzard-item-cache.sqlite3
          key: blizzard-item-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blizzard-item-cache-${{ runner.os }}-

      - name: Import current Retail data
        id: import
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/import_blizzard_data.py

      - name: Persist updated Blizzard item cache
        if: always() && hashFiles('data/blizzard-item-cache.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data/blizzard-item-cache.sqlite3
          key: blizzard-item-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify imported item-stat coverage
        run: python scripts/verify_item_stat_coverage.py

      - name: Commit discovered equipment index and validated catalog
        if: always() && (hashFiles('data/equipment-discovery-index.json') != '' || steps.import.outputs.gear_sections_validated == 'true')
        run: |
          git config user.name "wow-gear-optimizer"
          git config user.email "actions@github.com"

          # Broad Blizzard inventory discovery is useful even when a later source
          # verification/enrichment step fails. Persist the index independently of
          # recommendation eligibility so subsequent runs can resume from it.
          if [ -f data/equipment-discovery-index.json ]; then
            git add data/equipment-discovery-index.json
          fi

          # Never publish partial section files: only stage them after the importer
          # explicitly confirms that every required season-verified section passed.
          if [ "${{ steps.import.outputs.gear_sections_validated }}" = "true" ]; then
            git add data/equipment-sections/
            if [ "${{ steps.import.outcome }}" = "success" ]; then
              git add data/current-retail.json
            fi
          fi

          git diff --cached --quiet && exit 0
          if [ "${{ steps.import.outcome }}" = "success" ] && [ "${{ steps.import.outputs.gear_sections_validated }}" = "true" ]; then
            git commit -m "Update current Retail WoW data and discovery index"
          elif [ -f data/equipment-discovery-index.json ]; then
            git commit -m "Persist Blizzard equipment discovery index"
          else
            git commit -m "Update validated equipment sections"
          fi
          # Code or another validated import may land after checkout. Rebase this
          # generated-data commit onto the latest branch before pushing; never force-push.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
