name: Import WoW Retail Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/import_blizzard_data.py"
      - ".github/workflows/import-wow-data.yml"
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write
  issues: write

# Avoid overlapping full-catalog scans and only run automatic imports from main.
concurrency:
  group: wow-retail-data-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import current Retail data
        id: import
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/import_blizzard_data.py

      - name: Alert on blocked automatic import
        if: failure() && steps.import.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "Automatic WoW data import is blocked";
            const body = [
              "The scheduled/current Retail data import failed, so no new dataset was published.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "This is intentionally fail-closed: if Blizzard changes the season or exposes data the importer cannot verify, the site keeps the last verified dataset instead of publishing guessed rules.",
              "",
              "Review the importer and Blizzard's current Retail season/update information before changing the verified season rules."
            ].join("\\n");

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            const existing = openIssues.find(issue => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Verify imported item-stat coverage
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data/current-retail.json")
          if not path.exists():
              sys.exit("VERIFY FAILED: importer did not create the catalog.")

          with path.open(encoding="utf-8") as handle:
              dataset = json.load(handle)

          items = dataset.get("items") or []
          coverage = (dataset.get("apiCheck") or {}).get("itemStatCoverage") or {}
          verified = coverage.get("itemsWithVerifiedStats", 0)
          total = len(items)
          print(f"Catalog items: {total}; items with numeric stats: {verified}")

          if not total:
              sys.exit("VERIFY FAILED: catalog contains no items; refusing to publish.")
          if not isinstance(verified, int) or verified <= 0:
              sys.exit("VERIFY FAILED: no items have verified numeric stats; refusing to publish unusable catalog.")

          print("Basic item-stat presence gate passed. This does not prove complete coverage or correct item variants.")
          PY

      - name: Commit updated dataset
        run: |
          git config user.name "wow-gear-optimizer"
          git config user.email "actions@github.com"
          git add data/current-retail.json
          git diff --cached --quiet && exit 0
          git commit -m "Update current Retail WoW data"
          git push
