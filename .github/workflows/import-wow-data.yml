name: Import WoW Retail Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/import_blizzard_data.py"
      - "scripts/equipment_catalog_sections.py"
      - "scripts/verify_item_stat_coverage.py"
      - ".github/workflows/import-wow-data.yml"
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write
  issues: write

# Avoid overlapping full-catalog scans. Feature-branch runs are for authenticated validation before merge.
concurrency:
  group: wow-retail-data-import
  cancel-in-progress: false

jobs:
  import:
    # Feature-branch pushes are code/test iteration, not permission to start a 45-minute full import.
    # Use workflow_dispatch for deliberate validation; main and scheduled imports remain enabled.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore persistent Blizzard item cache
        uses: actions/cache/restore@v4
        with:
          path: data/blizzard-item-cache.sqlite3
          key: blizzard-item-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            blizzard-item-cache-${{ runner.os }}-

      - name: Import current Retail data
        id: import
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/import_blizzard_data.py

      - name: Persist updated Blizzard item cache
        if: always() && hashFiles('data/blizzard-item-cache.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: data/blizzard-item-cache.sqlite3
          key: blizzard-item-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify imported item-stat coverage
        run: python scripts/verify_item_stat_coverage.py

      - name: Commit updated dataset
        run: |
          git config user.name "wow-gear-optimizer"
          git config user.email "actions@github.com"
          git add data/current-retail.json data/equipment-sections/
          git diff --cached --quiet && exit 0
          git commit -m "Update current Retail WoW data"
          git push
