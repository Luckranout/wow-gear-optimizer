name: Test WoW Optimizer
# Step 34 verification trigger
# Step 33 verification trigger
# Step 32 verification trigger
# Step 31 verification trigger
# Step 30 verification trigger
# Step 29 verification trigger
# Step 28 verification trigger
# Step 27 verification trigger

on:
  push:
    branches:
      - main
      - step-4-upgrade-optimizer
    paths:
      - "optimizer.js"
      - "wow-data.js"
      - "scripts/**"
      - "tests/**"
      - "simulation-import.js"
      - ".github/workflows/test-optimizer.yml"
      - ".github/workflows/import-character.yml"
  pull_request:
    paths:
      - "optimizer.js"
      - "wow-data.js"
      - "scripts/**"
      - "tests/**"
      - "simulation-import.js"
      - ".github/workflows/test-optimizer.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run upgrade optimizer tests
        run: node tests/optimizer-upgrades.test.js
      - name: Run character import UI tests
        run: node tests/character-import-ui.test.js
      - name: Run character importer tests
        run: python -m unittest tests/test_character_import.py

      - name: Run simulation import tests
        run: node tests/simulation-import.test.js


      - name: Run simulation export tests
        run: node tests/simulation-export.test.js

      - name: Run SimulationCraft optimizer mapping tests
        run: node tests/simulation-optimizer.test.js

      - name: Run equipped gear comparison tests
        run: node tests/equipped-gear-comparison.test.js

      - name: Run complete loadout UI tests
        run: node tests/complete-loadout-ui.test.js
      - name: Run live character lookup tests
        run: node tests/live-character-lookup.test.js
      - name: Run live character lookup UI tests
        run: node tests/live-character-lookup-ui.test.js
      - name: Run personal action plan tests
        run: node tests/personal-action-plan.test.js
      - name: Run gameplay coach tests
        run: node tests/gameplay-coach.test.js
      - name: Run talent-aware coach tests
        run: node tests/talent-aware-coach.test.js
      - name: Run character talent tests
        run: node tests/character-talents.test.js
      - name: Run talent-aware UI tests
        run: node tests/talent-aware-ui.test.js

      - name: Run content-aware coach tests
        run: node tests/content-aware-coach.test.js
      - name: Run content-aware UI tests
        run: node tests/content-aware-ui.test.js

      - name: Run combat preparation coach tests
        run: node tests/combat-preparation-coach.test.js
      - name: Run combat preparation UI tests
        run: node tests/combat-preparation-ui.test.js

      - name: Run situational gameplay coach tests
        run: node tests/situational-gameplay-coach.test.js
      - name: Run situational gameplay UI tests
        run: node tests/situational-gameplay-ui.test.js

      - name: Run encounter-aware coach tests
        run: node tests/encounter-aware-coach.test.js
      - name: Run encounter-aware UI tests
        run: node tests/encounter-aware-ui.test.js

      - name: Run build synthesis tests
        run: node tests/build-synthesis.test.js
      - name: Run build synthesis UI tests
        run: node tests/build-synthesis-ui.test.js

      - name: Run set guidance tests
        run: node tests/set-guidance.test.js
      - name: Run set guidance UI tests
        run: node tests/set-guidance-ui.test.js

      - name: Run special item guidance tests
        run: node tests/special-item-guidance.test.js
      - name: Run special item UI tests
        run: node tests/special-item-ui.test.js

      - name: Run upgrade spending tests
        run: node tests/upgrade-spending.test.js
      - name: Run upgrade spending UI tests
        run: node tests/upgrade-spending-ui.test.js
